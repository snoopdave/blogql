name: agent-tests

on:
  workflow_call:

jobs:

  build-test-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js 24
      uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: yarn
        cache-dependency-path: ./agent/yarn.lock

    - name: Build and test agent
      run: |
        yarn install --frozen-lockfile
        yarn test
      working-directory: agent
